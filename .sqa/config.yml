config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/im:
      branch: v1.19.2
      repo: https://github.com/grycap/im
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/im git:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-flax-badger.sh
        container: qc.acc_fuzzy-olivine-flamingo
  QC.Doc:
    repos:
      github.com/grycap/im find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-yellow-yak.sh
        container: qc.doc_crappy-saffron-worm
      github.com/grycap/im git:
        commands:
        - /usr/bin/env sh .sqa/script.ready-pink-chimpanzee.sh
        container: qc.doc_stealthy-ecru-penguin
      github.com/grycap/im markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.crabby-ivory-urchin.sh
        container: qc.doc_fuzzy-khaki-wolfhound
      github.com/grycap/im restructuredtext-lint:
        commands:
        - /usr/bin/env sh .sqa/script.tasty-scarlet-setter.sh
        container: qc.doc_cranky-vermilion-quokka
  QC.Lic:
    repos:
      github.com/grycap/im licensee:
        commands:
        - /usr/bin/env sh .sqa/script.skimpy-peach-wallaby.sh
        container: qc.lic_squirrely-periwinkle-meerkat
  QC.Met:
    repos:
      github.com/grycap/im validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.sunny-ivory-tapir.sh
        container: qc.met_woolly-cornflower-dog
  QC.Sec:
    repos:
      github.com/grycap/im bandit:
        commands:
        - /usr/bin/env sh .sqa/script.foggy-red-dachshund.sh
        container: qc.sec_gummy-heliotrope-toad
  QC.Sty:
    repos:
      github.com/grycap/im flake8:
        commands:
        - /usr/bin/env sh .sqa/script.clammy-tomato-frigatebird.sh
        container: qc.sty_craggy-eggplant-capybara
      github.com/grycap/im hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.cloudy-carmine-argentino.sh
        container: qc.sty_boozy-seashell-quoll
      github.com/grycap/im jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.breezy-orchid-moose.sh
        container: qc.sty_squirrely-sangria-owl
  QC.Uni:
    repos:
      github.com/grycap/im commands:
        commands:
        - /usr/bin/env sh .sqa/script.shaky-ultramarine-bear.sh
        container: qc.uni_goopy-harlequin-flamingo
  QC.Ver:
    repos:
      github.com/grycap/im get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.freaky-alizarin-ferret.sh
        container: qc.ver_ready-green-rhinoceros
timeout: 5400
