config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/im:
      branch: v1.19.1
      repo: https://github.com/grycap/im
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/im git:
        commands:
        - /usr/bin/env sh .sqa/script.clammy-thistle-havanese.sh
        container: qc.acc_muggy-orchid-tarsier
  QC.Doc:
    repos:
      github.com/grycap/im find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.hilly-bronze-chin.sh
        container: qc.doc_zippy-lavender-beagle
      github.com/grycap/im git:
        commands:
        - /usr/bin/env sh .sqa/script.greasy-alizarin-dingo.sh
        container: qc.doc_lovely-champagne-tiger
      github.com/grycap/im markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.snippy-orange-macaque.sh
        container: qc.doc_fuzzy-purple-tamarin
      github.com/grycap/im restructuredtext-lint:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-vermilion-millipede.sh
        container: qc.doc_paltry-sangria-quokka
  QC.Lic:
    repos:
      github.com/grycap/im licensee:
        commands:
        - /usr/bin/env sh .sqa/script.ready-auburn-eel.sh
        container: qc.lic_beady-dandelion-hamster
  QC.Met:
    repos:
      github.com/grycap/im validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.pretty-goldenrod-squid.sh
        container: qc.met_tasty-charcoal-cheetah
  QC.Sec:
    repos:
      github.com/grycap/im bandit:
        commands:
        - /usr/bin/env sh .sqa/script.pokey-goldenrod-horse.sh
        container: qc.sec_shaggy-jade-gorilla
  QC.Sty:
    repos:
      github.com/grycap/im flake8:
        commands:
        - /usr/bin/env sh .sqa/script.cheeky-pear-russel.sh
        container: qc.sty_surly-emerald-impala
      github.com/grycap/im hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.boozy-coral-cattle.sh
        container: qc.sty_clammy-smalt-tuatara
      github.com/grycap/im jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.lanky-peach-loon.sh
        container: qc.sty_stinky-russet-lobster
  QC.Uni:
    repos:
      github.com/grycap/im tox:
        commands:
        - /usr/bin/env sh .sqa/script.greasy-rust-gibbon.sh
        container: qc.uni_skinny-persimmon-kudu
  QC.Ver:
    repos:
      github.com/grycap/im get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-eggplant-lion.sh
        container: qc.ver_nerdy-magnolia-zebra
timeout: 5400
