config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/im:
      branch: sqa
      repo: https://github.com/grycap/im
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/im git:
        commands:
        - /usr/bin/env sh .sqa/script.cozy-red-malamute.sh
        container: qc.acc_dorky-champagne-mole
  QC.Doc:
    repos:
      github.com/grycap/im find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.squirrely-wheat-fox.sh
        container: qc.doc_surly-ruby-chamois
      github.com/grycap/im git:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-wisteria-armadillo.sh
        container: qc.doc_foggy-ultramarine-magpie
      github.com/grycap/im markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.grumpy-malachite-wallaby.sh
        container: qc.doc_scaly-puce-dollar
      github.com/grycap/im restructuredtext-lint:
        commands:
        - /usr/bin/env sh .sqa/script.cranky-azure-hyena.sh
        container: qc.doc_cozy-mustard-uguisu
  QC.Lic:
    repos:
      github.com/grycap/im licensee:
        commands:
        - /usr/bin/env sh .sqa/script.gloppy-razzmatazz-retriever.sh
        container: qc.lic_snoopy-fuchsia-mandrill
  QC.Met:
    repos:
      github.com/grycap/im validate_codemeta:
        commands:
        - /usr/bin/env sh .sqa/script.flabby-cream-snake.sh
        container: qc.met_wheezy-peach-angelfish
  QC.Sec:
    repos:
      github.com/grycap/im bandit:
        commands:
        - /usr/bin/env sh .sqa/script.greasy-mustard-eagle.sh
        container: qc.sec_hasty-plum-affenpinscher
  QC.Sty:
    repos:
      github.com/grycap/im flake8:
        commands:
        - /usr/bin/env sh .sqa/script.nippy-razzmatazz-elephant.sh
        container: qc.sty_bumpy-beige-lemming
      github.com/grycap/im hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.squirrely-russet-turkey.sh
        container: qc.sty_lanky-periwinkle-swan
      github.com/grycap/im jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.lanky-russet-oriole.sh
        container: qc.sty_droopy-corn-budgerigar
  QC.Uni:
    repos:
      github.com/grycap/im commands:
        commands:
        - /usr/bin/env sh .sqa/script.beady-mauve-dachsbracke.sh
        container: qc.uni_homely-thistle-molly
  QC.Ver:
    repos:
      github.com/grycap/im get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.queasy-tangerine-wolf.sh
        container: qc.ver_droopy-ecru-capuchin
timeout: 5400
