config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/grycap/im:
      branch: master
      repo: https://github.com/grycap/im
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/grycap/im git:
        commands:
        - /usr/bin/env sh .sqa/script.daffodil_alert_toad.sh
        container: qc.acc_grege_amiable_armadillo
  QC.Doc:
    repos:
      github.com/grycap/im find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.burgundy_supportive_crane.sh
        container: qc.doc_gunmetal_thoughtful_badger
      github.com/grycap/im git:
        commands:
        - /usr/bin/env sh .sqa/script.persimmon_sincere_camel.sh
        container: qc.doc_lilac_harmonious_coyote
      github.com/grycap/im markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.burgundy_goofy_squirrel.sh
        container: qc.doc_peony_enthusiastic_weasel
      github.com/grycap/im restructuredtext-lint:
        commands:
        - /usr/bin/env sh .sqa/script.amaranth_tough_mandrill.sh
        container: qc.doc_butter_imaginative_penguin
