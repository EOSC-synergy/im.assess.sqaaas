        commands:
        - /usr/bin/env sh .sqa/script.puce_diligent_flamingo.sh
        container: qc.sec_fandango_proud_toad
  QC.Sty:
    repos:
      github.com/grycap/im flake8:
        commands:
        - /usr/bin/env sh .sqa/script.watermelon_content_finch.sh
        container: qc.sty_green_thoughtful_axolotl
